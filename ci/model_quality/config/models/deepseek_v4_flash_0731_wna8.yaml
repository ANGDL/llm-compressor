schema_version: 1

# DeepSeek-V4-Flash-0731 WNA8 (mixed W4A8 experts / W8A8 other) streaming
# quantization, exercised on the node16 llm-quant-base container.
#
# Runtime smoke does not use vLLM here. The target host serves the quantized
# checkpoint with the xSGL container (zhuang_xsgl_0923, /workspace/ds_v4/w4a8/
# run.sh), so runtime_smoke.command queries that already running server instead
# of loading the model with vLLM. Start the server before the stage, e.g.
#
#   docker exec zhuang_xsgl_0923 bash -lc 'source /root/miniconda/etc/profile.d/conda.sh \
#     && conda activate python310_torch29_cuda && cd /workspace/ds_v4/w4a8 \
#     && model_dir=<runs-root>/<run-id>/<model-id>/model port=30000 bash run.sh'
#
# Both containers share the host network, so http://127.0.0.1:30000 is visible
# from the CI container. The run.sh default (tp_size=4, CUDA_VISIBLE_DEVICES=4-7)
# must not overlap the GPU used by the quantization stage.
models:
  - id: deepseek-v4-flash-0731-wna8
    enabled: true
    priority: P0
    business_tier: core
    max_result_age_hours: 24
    source:
      path: /ssd4/models/DeepSeek-V4-Flash-0731
      revision: local-checksum
    resources:
      # Quantization is streaming on a single device; the xSGL smoke uses 4.
      gpu_count: 1
      runtime_gpu_count: 4
      gpu_memory_gib: 96
      host_memory_gib: 512
      minimum_free_disk_gib: 600
      io_weight: 3
      estimated_gpu_hours: 5
      estimated_eval_gpu_hours: 16
      timeout_hours: 12
      required_capabilities:
        - torch_accelerator
        - runtime:sglang
    workflow:
      revision: c5921a139d9f076d26bfedec3fd88bf75c2ec
      quantize:
        - python3
        - examples/streaming_oneshot/deepseek_v4_wNa8.py
        - --model-id
        - "{source_path}"
        - --dataset-id
        - /data/quant/calibration_data_deepseek-v4-flash-0731.jsonl
        - /data/quant/ultrachat_200k
        - --num-calibration-samples
        - "32"
        - --max-sequence-length
        - "8192"
        - --batch-size
        - "1"
        - --quant-mode
        - wna8
        - --use-float32-scale-dtype
        - --output-dir
        - "{output_dir}"
        - --work-dir
        - "{work_dir}"
      forbidden_argument_pairs:
        - [--checkpoint-progress, --async-save]
    validation:
      profile: causal_lm
      streaming: true
      require_quantization_config: true
      min_quantization_auxiliary_tensors: 1
      # The raw DeepSeek checkpoint format stores per-tensor quantization scales
      # as `...scale`, not the compressed-tensors `.weight_scale` spelling.
      quantization_auxiliary_suffixes:
        - .weight_scale
        - .weight_zero_point
        - .weight_packed
        - .weight_compressed
        - .scale
      quantization_scale_suffixes:
        - .weight_scale
        - .weight_zero_point
        - .scale
      required_files:
        - config.json
        - model.safetensors.index.json
        - recipe.yaml
        - FINALIZED
    runtime_smoke:
      enabled: true
      runtime_revision: sglang-0.5.10+44a64804b
      prompts:
        - The capital of France is
        - Solve 17 * 23.
      command:
        - python3
        - -m
        - ci.model_quality.xsgl_smoke
        - --model
        - "{output_dir}"
        - --base-url
        - http://127.0.0.1:30000
        - --served-model-name
        - deepseek-v4-flash
        - --prompts-json
        - '["The capital of France is", "Solve 17 * 23."]'
        - --wait-ready-seconds
        - "1800"
        - --output
        - "{reports_dir}/runtime-smoke-output.json"
      result_file: "{reports_dir}/runtime-smoke-output.json"
    evaluation:
      enabled_by_default: false
      profile: causal_lm
      runtime_revision: replace-with-vllm-lm-eval-image-digest
      command:
        - /opt/vllm/bin/python
        - -m
        - ci.model_quality.evaluators.lm_eval_pair
        - --base-model
        - "{source_path}"
        - --compressed-model
        - "{output_dir}"
        - --task
        - gsm8k
        - --metrics-json
        - '[{"name":"exact_match,flexible-extract","direction":"higher","min_recovery":0.95}]'
        - --num-fewshot
        - "5"
        - --limit
        - "250"
        - --model-args-json
        - '{"tensor_parallel_size":4,"dtype":"auto","add_bos_token":true}'
        - --work-dir
        - "{reports_dir}/lm-eval-work"
        - --output
        - "{reports_dir}/evaluation-raw.json"
      result_file: "{reports_dir}/evaluation-raw.json"
    upload:
      enabled: true
      # Published layout:
      #   bos:/klx-public/llm-demo/quant/<model-id>/runs/<run-id>/model
      #   bos:/klx-public/llm-demo/quant/<model-id>/runs/<run-id>/reports
      #   bos:/klx-public/llm-demo/quant/<model-id>/runs/<run-id>/SUCCESS.json
      remote_prefix: bos:/klx-public/llm-demo/quant
      allowlist: [model, reports]
      commands:
        # `bcecmd bos cp -r <dir> <dst>` copies the *contents* of <dir> into
        # <dst>, so object keys line up 1:1 with the allowlist entries.
        - [bcecmd, bos, cp, -r, -y, --quiet, --disable-bar, "{output_dir}", "{remote_run_prefix}/model"]
        - [bcecmd, bos, cp, -r, -y, --quiet, --disable-bar, "{reports_dir}", "{remote_run_prefix}/reports"]
      verify_commands:
        # `bcecmd bos ls` exits 0 even for missing prefixes, so existence is
        # checked by downloading a small representative object: `bos cp`
        # returns non-zero and writes nothing when the object is absent.
        - [bcecmd, bos, cp, -y, --quiet, --disable-bar, "{remote_run_prefix}/model/config.json", /tmp/mqci-verify-model-config.json]
        - [bcecmd, bos, cp, -y, --quiet, --disable-bar, "{remote_run_prefix}/reports/summary.json", /tmp/mqci-verify-reports-summary.json]
      success_commands:
        - [bcecmd, bos, cp, -y, --quiet, --disable-bar, "{run_dir}/commit-markers/SUCCESS.json", "{remote_run_prefix}/SUCCESS.json"]
