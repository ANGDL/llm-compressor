<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Streaming PTQ route-aware expert parallel architecture</title>
  <desc id="desc">A route-aware streaming post-training quantization architecture. Calibration inputs pass through a gate into a reusable RoutePlan. A planner combines route work, expert cost, owner memory, and measured device rates to create resident expert windows. Each rank runs route packing, expert forward with Hessian accumulation, quantize and write, then releases the window. Partial outputs are combined in a deterministic order.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #475569; }
      .section { font: 700 16px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .label { font: 600 14px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .body { font: 400 13px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #334155; }
      .small { font: 400 11px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #475569; }
      .tiny { font: 400 10px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #64748b; }
      .lane-label { font: 700 13px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #1e293b; }
      .white { fill: #ffffff; }
      .data { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .control { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow-dark); }
      .complete { stroke: #059669; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f8fafc"/>
  <rect x="36" y="28" width="1528" height="82" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="68" y="64" class="title">Route-aware streaming EP for PTQ</text>
  <text x="68" y="91" class="subtitle">One gate result is reused across resident windows; each owner obeys its own memory and token-work budget.</text>
  <line x1="1190" y1="58" x2="1230" y2="58" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1242" y="63" class="small">data / tensor flow</text>
  <line x1="1190" y1="84" x2="1230" y2="84" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrow-dark)"/>
  <text x="1242" y="89" class="small">control / admission</text>

  <rect x="36" y="132" width="350" height="620" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="62" y="166" class="section">1 · Route extraction</text>
  <text x="62" y="188" class="small">The router runs once per target scope.</text>

  <rect x="62" y="216" width="298" height="104" rx="12" fill="#ffffff" stroke="#60a5fa" filter="url(#shadow)"/>
  <circle cx="88" cy="246" r="15" fill="#dbeafe"/>
  <text x="88" y="251" text-anchor="middle" class="label" fill="#1d4ed8">A</text>
  <text x="116" y="247" class="label">Calibration boundary</text>
  <text x="84" y="273" class="body">Hidden states, sequence ids,</text>
  <text x="84" y="293" class="body">and stable token rows.</text>

  <path d="M211 320 L211 354" class="data"/>
  <rect x="62" y="362" width="298" height="104" rx="12" fill="#ffffff" stroke="#60a5fa" filter="url(#shadow)"/>
  <circle cx="88" cy="392" r="15" fill="#dbeafe"/>
  <text x="88" y="397" text-anchor="middle" class="label" fill="#1d4ed8">B</text>
  <text x="116" y="393" class="label">Gate / top-k routing</text>
  <text x="84" y="419" class="body">expert ids · token rows ·</text>
  <text x="84" y="439" class="body">slot rows · route weights</text>

  <path d="M211 466 L211 500" class="data"/>
  <rect x="62" y="508" width="298" height="174" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="88" cy="538" r="15" fill="#dbeafe"/>
  <text x="88" y="543" text-anchor="middle" class="label" fill="#1d4ed8">C</text>
  <text x="116" y="539" class="label">Reusable RoutePlan</text>
  <text x="84" y="568" class="body">token_indices + route_weights</text>
  <text x="84" y="589" class="body">sequence_ids + offsets</text>
  <text x="84" y="610" class="body">route_fingerprint</text>
  <rect x="84" y="630" width="250" height="30" rx="8" fill="#eff6ff"/>
  <text x="209" y="650" text-anchor="middle" class="small">No token rerouting; preserve order and weights</text>

  <rect x="416" y="132" width="364" height="620" rx="16" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="442" y="166" class="section">2 · Planning and admission</text>
  <text x="442" y="188" class="small">Stable placement epoch for the target scope.</text>

  <rect x="442" y="216" width="312" height="116" rx="12" fill="#ffffff" stroke="#a78bfa" filter="url(#shadow)"/>
  <text x="466" y="244" class="label">Route + cost profile</text>
  <text x="466" y="270" class="body">routed_tokens(e) × token_work_units(e)</text>
  <text x="466" y="291" class="body">storage / Hessian / update bytes</text>
  <text x="466" y="312" class="body">owner compute_rate and memory budget</text>

  <path d="M598 332 L598 364" class="control"/>
  <rect x="442" y="372" width="312" height="126" rx="12" fill="#ffffff" stroke="#a78bfa" filter="url(#shadow)"/>
  <text x="466" y="401" class="label">Load-balanced placement</text>
  <text x="466" y="427" class="body">minimize normalized owner work</text>
  <text x="466" y="448" class="body">subject to weight + state ≤ usable VRAM</text>
  <text x="466" y="469" class="body">static byte fallback if no route profile</text>

  <path d="M598 498 L598 530" class="control"/>
  <rect x="442" y="538" width="312" height="174" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="466" y="568" class="label">Resident window planner</text>
  <text x="466" y="594" class="body">Wᵢ = experts resident on owner r</text>
  <text x="466" y="615" class="body">dispatch chunks fit token capacity</text>
  <text x="466" y="636" class="body">Hessian stays device-local until complete</text>
  <rect x="466" y="654" width="264" height="36" rx="8" fill="#f5f3ff"/>
  <text x="598" y="677" text-anchor="middle" class="small">hard admission before weight materialization</text>

  <path d="M360 595 C390 595 395 274 442 274" class="data"/>
  <path d="M754 625 C790 625 795 278 832 278" class="control"/>
  <text x="770" y="420" class="tiny" transform="rotate(-76 770 420)">plan + admit</text>

  <rect x="812" y="132" width="752" height="620" rx="16" fill="#ecfdf5" stroke="#86efac"/>
  <text x="838" y="166" class="section">3 · Per-owner asynchronous execution</text>
  <text x="838" y="188" class="small">Ranks progress independently; the target waits only at the commit boundary.</text>

  <rect x="838" y="210" width="700" height="112" rx="12" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="858" y="239" class="lane-label">EP rank 0 · W₀</text>
  <rect x="980" y="224" width="128" height="70" rx="9" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="1044" y="250" text-anchor="middle" class="label">A · pack</text>
  <text x="1044" y="270" text-anchor="middle" class="tiny">route rows</text>
  <rect x="1122" y="224" width="156" height="70" rx="9" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="1200" y="250" text-anchor="middle" class="label">B · forward</text>
  <text x="1200" y="270" text-anchor="middle" class="tiny">Hessian accumulate</text>
  <rect x="1292" y="224" width="156" height="70" rx="9" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="1370" y="250" text-anchor="middle" class="label">C · update</text>
  <text x="1370" y="270" text-anchor="middle" class="tiny">write + release</text>
  <rect x="1462" y="224" width="56" height="70" rx="9" fill="#dcfce7" stroke="#4ade80"/>
  <text x="1490" y="250" text-anchor="middle" class="tiny">W₁</text>
  <path d="M1108 259 L1122 259" class="data"/>
  <path d="M1278 259 L1292 259" class="complete"/>
  <path d="M1448 259 L1462 259" class="control"/>

  <rect x="838" y="336" width="700" height="112" rx="12" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="858" y="365" class="lane-label">EP rank 1 · W₀</text>
  <rect x="980" y="350" width="128" height="70" rx="9" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="1044" y="376" text-anchor="middle" class="label">A · pack</text>
  <text x="1044" y="396" text-anchor="middle" class="tiny">route rows</text>
  <rect x="1122" y="350" width="156" height="70" rx="9" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="1200" y="376" text-anchor="middle" class="label">B · forward</text>
  <text x="1200" y="396" text-anchor="middle" class="tiny">Hessian accumulate</text>
  <rect x="1292" y="350" width="156" height="70" rx="9" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="1370" y="376" text-anchor="middle" class="label">C · update</text>
  <text x="1370" y="396" text-anchor="middle" class="tiny">write + release</text>
  <rect x="1462" y="350" width="56" height="70" rx="9" fill="#dcfce7" stroke="#4ade80"/>
  <text x="1490" y="376" text-anchor="middle" class="tiny">W₁</text>
  <path d="M1108 385 L1122 385" class="data"/>
  <path d="M1278 385 L1292 385" class="complete"/>
  <path d="M1448 385 L1462 385" class="control"/>

  <rect x="838" y="462" width="700" height="112" rx="12" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="858" y="491" class="lane-label">EP rank 2 · W₀</text>
  <rect x="980" y="476" width="128" height="70" rx="9" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="1044" y="502" text-anchor="middle" class="label">A · pack</text>
  <text x="1044" y="522" text-anchor="middle" class="tiny">route rows</text>
  <rect x="1122" y="476" width="156" height="70" rx="9" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="1200" y="502" text-anchor="middle" class="label">B · forward</text>
  <text x="1200" y="522" text-anchor="middle" class="tiny">Hessian accumulate</text>
  <rect x="1292" y="476" width="156" height="70" rx="9" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="1370" y="502" text-anchor="middle" class="label">C · update</text>
  <text x="1370" y="522" text-anchor="middle" class="tiny">write + release</text>
  <rect x="1462" y="476" width="56" height="70" rx="9" fill="#dcfce7" stroke="#4ade80"/>
  <text x="1490" y="502" text-anchor="middle" class="tiny">W₁</text>
  <path d="M1108 511 L1122 511" class="data"/>
  <path d="M1278 511 L1292 511" class="complete"/>
  <path d="M1448 511 L1462 511" class="control"/>

  <rect x="838" y="588" width="700" height="112" rx="12" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="858" y="617" class="lane-label">EP rank 3 · W₀</text>
  <rect x="980" y="602" width="128" height="70" rx="9" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="1044" y="628" text-anchor="middle" class="label">A · pack</text>
  <text x="1044" y="648" text-anchor="middle" class="tiny">route rows</text>
  <rect x="1122" y="602" width="156" height="70" rx="9" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="1200" y="628" text-anchor="middle" class="label">B · forward</text>
  <text x="1200" y="648" text-anchor="middle" class="tiny">Hessian accumulate</text>
  <rect x="1292" y="602" width="156" height="70" rx="9" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="1370" y="628" text-anchor="middle" class="label">C · update</text>
  <text x="1370" y="648" text-anchor="middle" class="tiny">write + release</text>
  <rect x="1462" y="602" width="56" height="70" rx="9" fill="#dcfce7" stroke="#4ade80"/>
  <text x="1490" y="628" text-anchor="middle" class="tiny">W₁</text>
  <path d="M1108 637 L1122 637" class="data"/>
  <path d="M1278 637 L1292 637" class="complete"/>
  <path d="M1448 637 L1462 637" class="control"/>

  <text x="858" y="731" class="tiny">Each rank may have a different token capacity and work target.</text>

  <path d="M1188 752 C1188 790 960 790 960 814" class="data"/>
  <path d="M1240 752 C1240 790 1180 790 1180 814" class="data"/>
  <path d="M1292 752 C1292 790 1400 790 1400 814" class="data"/>

  <rect x="36" y="794" width="744" height="142" rx="16" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="62" y="828" class="section">4 · Deterministic combine and target commit</text>
  <text x="62" y="856" class="body">partial_output[owner][token] ← route_weight × expert_output</text>
  <text x="62" y="879" class="body">combine in stable owner/window order, then propagate to the next target</text>
  <rect x="62" y="898" width="410" height="24" rx="7" fill="#ecfdf5"/>
  <text x="267" y="915" text-anchor="middle" class="small">All owners complete before checkpoint commit</text>

  <rect x="812" y="794" width="752" height="142" rx="16" fill="#fff7ed" stroke="#fdba74" filter="url(#shadow)"/>
  <text x="838" y="828" class="section">GPTQ correctness boundary</text>
  <text x="838" y="856" class="body">last route chunk(e) → synchronize Hessian → quantize → publish → release</text>
  <text x="838" y="879" class="body">A window may leave only after every expert in that window saw all calibration tokens.</text>
  <rect x="838" y="898" width="540" height="24" rx="7" fill="#ffedd5"/>
  <text x="1108" y="915" text-anchor="middle" class="small">No partial Hessian is paged to CPU as a fallback</text>
</svg>
