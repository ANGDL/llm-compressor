<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">HIGGS 论文方法与项目实现流程</title>
  <desc id="desc">上半部分展示论文 HIGGS 的 Hadamard 旋转、Gaussian MSE 最优网格和部署流程，下半部分展示 LLM Compressor 中 HIGGS 配置选择器如何收集误差、建立 ILP 并输出量化配置。</desc>
  <defs>
    <linearGradient id="paperBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="repoBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f4f9f2"/>
      <stop offset="100%" stop-color="#fbfdf9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#16324f" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6da3"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b8651"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      svg {
        text-rendering: geometricPrecision;
        shape-rendering: geometricPrecision;
      }
      .title {
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
        font-size: 44px;
        font-weight: 700;
        fill: #172b4d;
      }
      .lane-title {
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
        font-size: 32px;
        font-weight: 700;
        fill: #17324d;
      }
      .lane-subtitle {
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
        font-size: 22px;
        font-weight: 500;
        fill: #496579;
      }
      .box-title {
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
        font-size: 24px;
        font-weight: 700;
        fill: #172b4d;
      }
      .box-text {
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
        font-size: 20px;
        font-weight: 500;
        fill: #304b60;
      }
      .small {
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
        font-size: 18px;
        font-weight: 500;
        fill: #526979;
      }
      .formula {
        font-family: "SFMono-Regular", "Roboto Mono", Consolas, monospace;
        font-size: 22px;
        font-weight: 600;
        fill: #284b63;
      }
      .paper-box { fill: #ffffff; stroke: #7aadd5; stroke-width: 2; }
      .repo-box { fill: #ffffff; stroke: #83a985; stroke-width: 2; }
      .decision { fill: #fff8e8; stroke: #c99227; stroke-width: 2; }
      .note { fill: #fffdf7; stroke: #d2b467; stroke-width: 1.5; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="title">HIGGS：论文方法与 LLM Compressor 项目实现</text>
  <text x="800" y="76" text-anchor="middle" class="small">论文：设计高质量的数据无关量化器；项目：分配候选方案的精度预算</text>

  <rect x="35" y="105" width="1530" height="430" rx="18" fill="url(#paperBg)" stroke="#a9cce8" stroke-width="2"/>
  <text x="65" y="145" class="lane-title">论文 HIGGS：Hadamard Incoherence with Gaussian MSE-optimal GridS</text>
  <text x="65" y="172" class="lane-subtitle">核心假设：模型困惑度增量可以近似分解为各层误差的加权和</text>

  <g filter="url(#shadow)">
    <rect x="65" y="215" width="190" height="125" rx="12" class="paper-box"/>
    <text x="160" y="247" text-anchor="middle" class="box-title">预训练权重</text>
    <text x="160" y="275" text-anchor="middle" class="formula">W₁*, …, Wₗ*</text>
    <text x="160" y="306" text-anchor="middle" class="box-text">按层、按组划分</text>
    <text x="160" y="326" text-anchor="middle" class="small">记录范数与预算</text>
  </g>
  <path d="M255 277 L305 277" stroke="#2d6da3" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>

  <g filter="url(#shadow)">
    <rect x="305" y="215" width="215" height="125" rx="12" class="paper-box"/>
    <text x="412" y="247" text-anchor="middle" class="box-title">RHT / Hadamard</text>
    <text x="412" y="275" text-anchor="middle" class="formula">w† = H · (w / ‖w‖₂)</text>
    <text x="412" y="306" text-anchor="middle" class="box-text">旋转：打散异常值</text>
    <text x="412" y="326" text-anchor="middle" class="small">近似高斯分布</text>
  </g>
  <path d="M520 277 L570 277" stroke="#2d6da3" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>

  <g filter="url(#shadow)">
    <rect x="570" y="215" width="235" height="125" rx="12" class="paper-box"/>
    <text x="687" y="247" text-anchor="middle" class="box-title">Gaussian MSE 网格</text>
    <text x="687" y="275" text-anchor="middle" class="formula">Gₙᵖ = {q₁, …, qₙ}</text>
    <text x="687" y="306" text-anchor="middle" class="box-text">标量 / 向量量化</text>
    <text x="687" y="326" text-anchor="middle" class="small">最小化高斯 MSE</text>
  </g>
  <path d="M805 277 L855 277" stroke="#2d6da3" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>

  <g filter="url(#shadow)">
    <rect x="855" y="215" width="215" height="125" rx="12" class="paper-box"/>
    <text x="962" y="247" text-anchor="middle" class="box-title">量化结果</text>
    <text x="962" y="275" text-anchor="middle" class="formula">q† + scales</text>
    <text x="962" y="306" text-anchor="middle" class="box-text">网格索引 + scale</text>
    <text x="962" y="326" text-anchor="middle" class="small">变换回原空间</text>
  </g>
  <path d="M1070 277 L1120 277" stroke="#2d6da3" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>

  <g filter="url(#shadow)">
    <rect x="1120" y="215" width="190" height="125" rx="12" class="paper-box"/>
    <text x="1215" y="247" text-anchor="middle" class="box-title">推理执行</text>
    <text x="1215" y="275" text-anchor="middle" class="box-text">逆 Hadamard 或</text>
    <text x="1215" y="298" text-anchor="middle" class="box-text">变换空间 GEMM</text>
    <text x="1215" y="326" text-anchor="middle" class="small">FLUTE 类内核</text>
  </g>
  <path d="M1310 277 L1360 277" stroke="#2d6da3" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>

  <g filter="url(#shadow)">
    <rect x="1360" y="215" width="175" height="125" rx="12" class="paper-box"/>
    <text x="1447" y="247" text-anchor="middle" class="box-title">部署模型</text>
    <text x="1447" y="277" text-anchor="middle" class="box-text">低存储成本</text>
    <text x="1447" y="300" text-anchor="middle" class="box-text">可接受的 PPL</text>
    <text x="1447" y="326" text-anchor="middle" class="small">依赖后端支持</text>
  </g>

  <path d="M160 340 L160 412 L300 412" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M412 340 L412 412" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M687 340 L687 412" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arrowGray)"/>
  <g filter="url(#shadow)">
    <rect x="300" y="382" width="775" height="105" rx="12" class="decision"/>
    <text x="687" y="414" text-anchor="middle" class="box-title">Linearity theorem：全局误差近似分解</text>
    <text x="687" y="445" text-anchor="middle" class="formula">E[PPL(Ŵ)] − PPL(W*) ≈ Σₗ αₗ · tₗ²</text>
    <text x="687" y="471" text-anchor="middle" class="box-text">αₗ 表示层重要性；tₗ² 表示相对 Frobenius / MSE 误差</text>
  </g>
  <path d="M1075 434 L1150 434 L1150 382" stroke="#c99227" stroke-width="2.5" fill="none" marker-end="url(#arrowGray)"/>
  <g filter="url(#shadow)">
    <rect x="1150" y="382" width="350" height="105" rx="12" class="decision"/>
    <text x="1325" y="414" text-anchor="middle" class="box-title">动态 / 非均匀位宽分配</text>
    <text x="1325" y="443" text-anchor="middle" class="box-text">收集候选 bitwidth、αₗ、tₗⱼ²</text>
    <text x="1325" y="467" text-anchor="middle" class="box-text">在平均 bitwidth 约束下求全局最优</text>
  </g>

  <rect x="65" y="510" width="1435" height="1" fill="#9fc1df"/>
  <text x="800" y="524" text-anchor="middle" class="small">RHT、Gaussian grid、FLUTE 和 αₗ 校准属于论文方法</text>

  <rect x="35" y="570" width="1530" height="430" rx="18" fill="url(#repoBg)" stroke="#b4d0b5" stroke-width="2"/>
  <text x="65" y="610" class="lane-title">LLM Compressor 当前实现：HIGGS 配置选择器</text>
  <text x="65" y="637" class="lane-subtitle">目标：按名义位宽预算，为每个逻辑权重选择候选 scheme</text>

  <g filter="url(#shadow)">
    <rect x="65" y="680" width="210" height="125" rx="12" class="repo-box"/>
    <text x="170" y="712" text-anchor="middle" class="box-title">Checkpoint 元数据</text>
    <text x="170" y="740" text-anchor="middle" class="box-text">名称、形状、分片</text>
    <text x="170" y="765" text-anchor="middle" class="box-text">targets / ignore</text>
    <text x="170" y="790" text-anchor="middle" class="small">展开堆叠专家</text>
  </g>
  <path d="M275 742 L325 742" stroke="#4b8651" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="325" y="680" width="215" height="125" rx="12" class="repo-box"/>
    <text x="432" y="712" text-anchor="middle" class="box-title">加载逻辑权重</text>
    <text x="432" y="740" text-anchor="middle" class="box-text">普通：按 shard</text>
    <text x="432" y="765" text-anchor="middle" class="box-text">流式：按逻辑融合组</text>
    <text x="432" y="790" text-anchor="middle" class="small">materializer 解码</text>
  </g>
  <path d="M540 742 L590 742" stroke="#4b8651" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="590" y="680" width="235" height="125" rx="12" class="repo-box"/>
    <text x="707" y="712" text-anchor="middle" class="box-title">Fake quantization 评分</text>
    <text x="707" y="740" text-anchor="middle" class="box-text">每个候选 scheme</text>
    <text x="707" y="765" text-anchor="middle" class="formula">Eᵢ,ₛ = mean((Wᵢ − Ŵᵢ,ₛ)²)</text>
    <text x="707" y="790" text-anchor="middle" class="small">融合组共享 global scale</text>
  </g>
  <path d="M825 742 L875 742" stroke="#4b8651" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="875" y="680" width="215" height="125" rx="12" class="repo-box"/>
    <text x="982" y="712" text-anchor="middle" class="box-title">启发式 α 与约束</text>
    <text x="982" y="740" text-anchor="middle" class="box-text">参数量、深度、类型</text>
    <text x="982" y="765" text-anchor="middle" class="box-text">融合组一致</text>
    <text x="982" y="790" text-anchor="middle" class="small">平均位宽约束</text>
  </g>
  <path d="M1090 742 L1140 742" stroke="#4b8651" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="1140" y="680" width="215" height="125" rx="12" class="repo-box"/>
    <text x="1247" y="712" text-anchor="middle" class="box-title">ILP / PuLP + CBC</text>
    <text x="1247" y="740" text-anchor="middle" class="formula">xᵢ,ₛ ∈ {0, 1}</text>
    <text x="1247" y="765" text-anchor="middle" class="box-text">最小化加权 MSE</text>
    <text x="1247" y="790" text-anchor="middle" class="small">输出每个矩阵的 scheme</text>
  </g>
  <path d="M1355 742 L1405 742" stroke="#4b8651" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="1405" y="680" width="130" height="125" rx="12" class="repo-box"/>
    <text x="1470" y="712" text-anchor="middle" class="box-title">Config</text>
    <text x="1470" y="742" text-anchor="middle" class="box-text">groups</text>
    <text x="1470" y="767" text-anchor="middle" class="box-text">targets</text>
    <text x="1470" y="792" text-anchor="middle" class="small">再交给 PTQ</text>
  </g>

  <path d="M1247 805 L1247 885 L1030 885" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arrowGray)"/>
  <g filter="url(#shadow)">
    <rect x="540" y="845" width="490" height="105" rx="12" class="note"/>
    <text x="785" y="878" text-anchor="middle" class="box-title">重要区别</text>
    <text x="785" y="907" text-anchor="middle" class="box-text">入口不实现 RHT、Gaussian grid、FLUTE</text>
    <text x="785" y="932" text-anchor="middle" class="box-text">只评估候选并生成分配配置</text>
  </g>
  <path d="M1470 805 L1470 885 L1350 885" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arrowGray)"/>
  <g filter="url(#shadow)">
    <rect x="1350" y="845" width="185" height="105" rx="12" class="repo-box"/>
    <text x="1442" y="878" text-anchor="middle" class="box-title">实际执行</text>
    <text x="1442" y="907" text-anchor="middle" class="box-text">model_free_ptq</text>
    <text x="1442" y="932" text-anchor="middle" class="box-text">或 oneshot / GPTQ</text>
  </g>
</svg>
